  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // ==========================================
    // 1. SOUND FX SYNTHESIZER (Web Audio API)
    // ==========================================
    class SoundFX {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playClick() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.04);
          gain.gain.setValueAtTime(0.06, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.04);
        } catch(e) {}
      }
      playStep() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(130, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(70, this.ctx.currentTime + 0.04);
          gain.gain.setValueAtTime(0.03, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.04);
        } catch(e) {}
      }
      playClean() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [1046.5, 1318.5, 1567.98].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.04);
            gain.gain.setValueAtTime(0.05, now + idx * 0.04);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.04 + 0.12);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.04);
            osc.stop(now + idx * 0.04 + 0.13);
          });
        } catch(e) {}
      }
      playComplete() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.09);
            gain.gain.setValueAtTime(0.08, now + idx * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.28);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.09);
            osc.stop(now + idx * 0.09 + 0.29);
          });
        } catch(e) {}
      }
      playAlert() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(280, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.07, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.14);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.14);
        } catch(e) {}
      }
    }
    const sound = new SoundFX();

    // ==========================================
    // 2. CONSTANTS & SYSTEM CONFIG
    // ==========================================
    const GRID_SIZE = 16;
    const CELL_EMPTY = 0;    // White / Dark Unexplored area
    const CELL_CLEANED = 1;  // Green Cleaned area
    const CELL_OBSTACLE = 2; // Grey Blocks
    const CELL_DUST = 3;     // Orange Dots

    const ALGORITHMS = {
      ASTAR: {
        id: 'ASTAR',
        name: 'A* Search (A-Star)',
        badge: 'Heuristic + Path Cost',
        shortDesc: 'Evaluates f(n) = g(n) + h(n) with Manhattan distance heuristic. Optimal, direct, and shortest path guaranteed.',
        complexity: 'O(b^d)',
        optimality: 'Guaranteed Shortest',
        type: 'Informed / Heuristic'
      },
      DIJKSTRA: {
        id: 'DIJKSTRA',
        name: "Dijkstra's Algorithm",
        badge: 'Uniform Cost Search',
        shortDesc: 'Explores radially by lowest cumulative path cost g(n). Equivalent to A* with h(n)=0; optimal minimum-cost path.',
        complexity: 'O(V + E log V)',
        optimality: 'Guaranteed Shortest',
        type: 'Uninformed / Cost'
      },
      BFS: {
        id: 'BFS',
        name: 'Breadth First Search (BFS)',
        badge: 'FIFO Wavefront',
        shortDesc: 'Explores level-by-level in concentric rings using a FIFO queue. Guarantees shortest path in unweighted grids.',
        complexity: 'O(V + E)',
        optimality: 'Guaranteed Shortest',
        type: 'Uninformed'
      },
      DFS: {
        id: 'DFS',
        name: 'Depth First Search (DFS)',
        badge: 'LIFO Deep Dive',
        shortDesc: 'Dives deeply along branches before backtracking using a LIFO stack. Does NOT guarantee shortest path; forms winding trails.',
        complexity: 'O(V + E)',
        optimality: 'Not Optimal (Suboptimal Winding)',
        type: 'Uninformed / Exploratory'
      }
    };

    // Preset Maps
    const PRESET_MAPS = {
      LIVING_ROOM: {
        name: 'Living Room Layout',
        description: 'Sofas, coffee table, entertainment center, with scattered dust clusters',
        obstacles: [
          [2, 2], [2, 3], [2, 4], [2, 5], [2, 6], // Sofa
          [5, 4], [5, 5], [6, 4], [6, 5], // Coffee Table
          [9, 1], [9, 2], [9, 3], // Media Console
          [12, 10], [12, 11], [13, 10], [13, 11], [14, 10], [14, 11], // Dining table
          [4, 11], [4, 12], [5, 11], [5, 12] // Armchair
        ],
        dusts: [
          [1, 1], [1, 7], [3, 4], [4, 7], [7, 2], [8, 6], [7, 12],
          [10, 8], [11, 4], [13, 3], [14, 8], [14, 14], [10, 13], [2, 14]
        ],
        robot: { x: 0, y: 0 }
      },
      OFFICE_MAZE: {
        name: 'Office Cubicle Maze',
        description: 'Challenging partitioned walls and narrow navigation corridors',
        obstacles: [
          [3, 0], [3, 1], [3, 2], [3, 3], [3, 4],
          [3, 7], [3, 8], [3, 9], [3, 10], [3, 11],
          [7, 4], [7, 5], [7, 6], [7, 7], [7, 8], [7, 9], [7, 10], [7, 11], [7, 12], [7, 13],
          [11, 2], [11, 3], [11, 4], [11, 5], [11, 6], [11, 7],
          [11, 10], [11, 11], [11, 12], [11, 13], [11, 14], [11, 15]
        ],
        dusts: [
          [1, 3], [1, 9], [5, 2], [5, 8], [5, 14], [9, 1], [9, 9], [9, 14], [13, 1], [13, 8], [14, 13]
        ],
        robot: { x: 0, y: 0 }
      },
      DUST_FIELD: {
        name: 'Heavy Dust Field',
        description: 'High dust density testbench across an open room',
        obstacles: [
          [4, 4], [4, 11], [11, 4], [11, 11],
          [7, 7], [7, 8], [8, 7], [8, 8]
        ],
        dusts: [
          [1, 2], [1, 5], [1, 9], [1, 13],
          [3, 1], [3, 7], [3, 14],
          [5, 3], [5, 8], [5, 12],
          [7, 1], [7, 5], [7, 10], [7, 14],
          [9, 3], [9, 8], [9, 13],
          [11, 1], [11, 6], [11, 14],
          [13, 2], [13, 7], [13, 11], [14, 4], [14, 9], [14, 13]
        ],
        robot: { x: 0, y: 0 }
      },
      ARENA_CLEAR: {
        name: 'Open Testing Arena',
        description: 'Clean boundary perimeter, optimal for algorithm benchmark tests',
        obstacles: [
          [7, 7], [7, 8], [8, 7], [8, 8]
        ],
        dusts: [
          [2, 2], [2, 13], [13, 2], [13, 13], [7, 3], [7, 12], [3, 7], [12, 7]
        ],
        robot: { x: 0, y: 0 }
      }
    };

    // ==========================================
    // 3. AI SEARCH ALGORITHMS
    // ==========================================
    const Pathfinder = {
      // Orthogonal 4 Directions: [dy, dx] (North, East, South, West)
      DIRECTIONS: [
        [-1, 0], // North
        [0, 1],  // East
        [1, 0],  // South
        [0, -1]  // West
      ],

      key: (y, x) => `${y},${x}`,

      isValid: (y, x, grid) => {
        return (
          y >= 0 &&
          y < GRID_SIZE &&
          x >= 0 &&
          x < GRID_SIZE &&
          grid[y][x] !== CELL_OBSTACLE
        );
      },

      manhattanDistance: (y1, x1, y2, x2) => {
        return Math.abs(y1 - y2) + Math.abs(x1 - x2);
      },

      // 1. A* (A-Star) Search
      aStar: (start, target, grid) => {
        const startTime = performance.now();
        const startKey = Pathfinder.key(start.y, start.x);
        const targetKey = Pathfinder.key(target.y, target.x);

        if (startKey === targetKey) {
          return { path: [start], visitedNodes: [], nodesExplored: 0, timeMs: 0.1 };
        }

        const openSet = [{ ...start, g: 0, h: Pathfinder.manhattanDistance(start.y, start.x, target.y, target.x), f: 0 }];
        openSet[0].f = openSet[0].g + openSet[0].h;

        const gScore = { [startKey]: 0 };
        const cameFrom = {};
        const visitedOrder = [];
        const inClosedSet = new Set();

        while (openSet.length > 0) {
          let lowestIdx = 0;
          for (let i = 1; i < openSet.length; i++) {
            if (openSet[i].f < openSet[lowestIdx].f || (openSet[i].f === openSet[lowestIdx].f && openSet[i].h < openSet[lowestIdx].h)) {
              lowestIdx = i;
            }
          }
          const current = openSet.splice(lowestIdx, 1)[0];
          const currKey = Pathfinder.key(current.y, current.x);

          if (inClosedSet.has(currKey)) continue;
          inClosedSet.add(currKey);
          visitedOrder.push({ y: current.y, x: current.x });

          if (current.y === target.y && current.x === target.x) {
            const path = [];
            let curr = currKey;
            while (curr) {
              const [y, x] = curr.split(',').map(Number);
              path.unshift({ y, x });
              curr = cameFrom[curr];
            }
            const endTime = performance.now();
            return {
              path,
              visitedNodes: visitedOrder,
              nodesExplored: visitedOrder.length,
              timeMs: Math.max(0.1, Number((endTime - startTime).toFixed(2)))
            };
          }

          for (const [dy, dx] of Pathfinder.DIRECTIONS) {
            const ny = current.y + dy;
            const nx = current.x + dx;
            const nKey = Pathfinder.key(ny, nx);

            if (!Pathfinder.isValid(ny, nx, grid) || inClosedSet.has(nKey)) continue;

            const tentativeG = gScore[currKey] + 1;
            if (gScore[nKey] === undefined || tentativeG < gScore[nKey]) {
              cameFrom[nKey] = currKey;
              gScore[nKey] = tentativeG;
              const h = Pathfinder.manhattanDistance(ny, nx, target.y, target.x);
              const f = tentativeG + h;
              
              const existingOpen = openSet.find(n => n.y === ny && n.x === nx);
              if (existingOpen) {
                existingOpen.g = tentativeG;
                existingOpen.f = f;
              } else {
                openSet.push({ y: ny, x: nx, g: tentativeG, h, f });
              }
            }
          }
        }

        const endTime = performance.now();
        return { path: [], visitedNodes: visitedOrder, nodesExplored: visitedOrder.length, timeMs: Number((endTime - startTime).toFixed(2)) };
      },

      // 2. Dijkstra's Algorithm (Uniform Cost Search)
      dijkstra: (start, target, grid) => {
        const startTime = performance.now();
        const startKey = Pathfinder.key(start.y, start.x);
        const targetKey = Pathfinder.key(target.y, target.x);

        if (startKey === targetKey) {
          return { path: [start], visitedNodes: [], nodesExplored: 0, timeMs: 0.1 };
        }

        const distances = { [startKey]: 0 };
        const pq = [{ ...start, dist: 0 }];
        const cameFrom = {};
        const visitedOrder = [];
        const settled = new Set();

        while (pq.length > 0) {
          pq.sort((a, b) => a.dist - b.dist);
          const current = pq.shift();
          const currKey = Pathfinder.key(current.y, current.x);

          if (settled.has(currKey)) continue;
          settled.add(currKey);
          visitedOrder.push({ y: current.y, x: current.x });

          if (current.y === target.y && current.x === target.x) {
            const path = [];
            let curr = currKey;
            while (curr) {
              const [y, x] = curr.split(',').map(Number);
              path.unshift({ y, x });
              curr = cameFrom[curr];
            }
            const endTime = performance.now();
            return {
              path,
              visitedNodes: visitedOrder,
              nodesExplored: visitedOrder.length,
              timeMs: Math.max(0.1, Number((endTime - startTime).toFixed(2)))
            };
          }

          for (const [dy, dx] of Pathfinder.DIRECTIONS) {
            const ny = current.y + dy;
            const nx = current.x + dx;
            const nKey = Pathfinder.key(ny, nx);

            if (!Pathfinder.isValid(ny, nx, grid) || settled.has(nKey)) continue;

            const newDist = distances[currKey] + 1;
            if (distances[nKey] === undefined || newDist < distances[nKey]) {
              distances[nKey] = newDist;
              cameFrom[nKey] = currKey;
              pq.push({ y: ny, x: nx, dist: newDist });
            }
          }
        }

        const endTime = performance.now();
        return { path: [], visitedNodes: visitedOrder, nodesExplored: visitedOrder.length, timeMs: Number((endTime - startTime).toFixed(2)) };
      },

      // 3. BFS (Breadth-First Search)
      bfs: (start, target, grid) => {
        const startTime = performance.now();
        const startKey = Pathfinder.key(start.y, start.x);
        const targetKey = Pathfinder.key(target.y, target.x);

        if (startKey === targetKey) {
          return { path: [start], visitedNodes: [], nodesExplored: 0, timeMs: 0.1 };
        }

        const queue = [{ y: start.y, x: start.x }];
        const cameFrom = {};
        const visited = new Set([startKey]);
        const visitedOrder = [];

        while (queue.length > 0) {
          const current = queue.shift();
          const currKey = Pathfinder.key(current.y, current.x);
          visitedOrder.push({ y: current.y, x: current.x });

          if (current.y === target.y && current.x === target.x) {
            const path = [];
            let curr = currKey;
            while (curr) {
              const [y, x] = curr.split(',').map(Number);
              path.unshift({ y, x });
              curr = cameFrom[curr];
            }
            const endTime = performance.now();
            return {
              path,
              visitedNodes: visitedOrder,
              nodesExplored: visitedOrder.length,
              timeMs: Math.max(0.1, Number((endTime - startTime).toFixed(2)))
            };
          }

          for (const [dy, dx] of Pathfinder.DIRECTIONS) {
            const ny = current.y + dy;
            const nx = current.x + dx;
            const nKey = Pathfinder.key(ny, nx);

            if (Pathfinder.isValid(ny, nx, grid) && !visited.has(nKey)) {
              visited.add(nKey);
              cameFrom[nKey] = currKey;
              queue.push({ y: ny, x: nx });
            }
          }
        }

        const endTime = performance.now();
        return { path: [], visitedNodes: visitedOrder, nodesExplored: visitedOrder.length, timeMs: Number((endTime - startTime).toFixed(2)) };
      },

      // 4. DFS (Depth-First Search)
      dfs: (start, target, grid) => {
        const startTime = performance.now();
        const startKey = Pathfinder.key(start.y, start.x);
        const targetKey = Pathfinder.key(target.y, target.x);

        if (startKey === targetKey) {
          return { path: [start], visitedNodes: [], nodesExplored: 0, timeMs: 0.1 };
        }

        const stack = [{ y: start.y, x: start.x }];
        const cameFrom = {};
        const visited = new Set();
        const visitedOrder = [];

        while (stack.length > 0) {
          const current = stack.pop();
          const currKey = Pathfinder.key(current.y, current.x);

          if (visited.has(currKey)) continue;
          visited.add(currKey);
          visitedOrder.push({ y: current.y, x: current.x });

          if (current.y === target.y && current.x === target.x) {
            const path = [];
            let curr = currKey;
            while (curr) {
              const [y, x] = curr.split(',').map(Number);
              path.unshift({ y, x });
              curr = cameFrom[curr];
            }
            const endTime = performance.now();
            return {
              path,
              visitedNodes: visitedOrder,
              nodesExplored: visitedOrder.length,
              timeMs: Math.max(0.1, Number((endTime - startTime).toFixed(2)))
            };
          }

          for (const [dy, dx] of Pathfinder.DIRECTIONS) {
            const ny = current.y + dy;
            const nx = current.x + dx;
            const nKey = Pathfinder.key(ny, nx);

            if (Pathfinder.isValid(ny, nx, grid) && !visited.has(nKey)) {
              if (!cameFrom[nKey]) {
                cameFrom[nKey] = currKey;
              }
              stack.push({ y: ny, x: nx });
            }
          }
        }

        const endTime = performance.now();
        return { path: [], visitedNodes: visitedOrder, nodesExplored: visitedOrder.length, timeMs: Number((endTime - startTime).toFixed(2)) };
      },

      run: (algoId, start, target, grid) => {
        switch (algoId) {
          case 'ASTAR': return Pathfinder.aStar(start, target, grid);
          case 'DIJKSTRA': return Pathfinder.dijkstra(start, target, grid);
          case 'BFS': return Pathfinder.bfs(start, target, grid);
          case 'DFS': return Pathfinder.dfs(start, target, grid);
          default: return Pathfinder.aStar(start, target, grid);
        }
      }
    };

    // ==========================================
    // 4. HTML5 CANVAS RADAR SCANNER COMPONENT
    // ==========================================
    function RadarCanvas({ distances }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let angle = 0;
        let animationFrameId;

        const render = () => {
          const width = canvas.width;
          const height = canvas.height;
          const cx = width / 2;
          const cy = height / 2;
          const radius = width / 2 - 8;

          // Clear canvas with deep dark background
          ctx.fillStyle = '#080d1a';
          ctx.fillRect(0, 0, width, height);

          // Draw radar range circles
          ctx.strokeStyle = 'rgba(0, 242, 254, 0.2)';
          ctx.lineWidth = 1;
          [0.25, 0.5, 0.75, 1.0].forEach(factor => {
            ctx.beginPath();
            ctx.arc(cx, cy, radius * factor, 0, Math.PI * 2);
            ctx.stroke();
          });

          // Draw crosshairs
          ctx.beginPath();
          ctx.moveTo(cx - radius, cy);
          ctx.lineTo(cx + radius, cy);
          ctx.moveTo(cx, cy - radius);
          ctx.lineTo(cx, cy + radius);
          ctx.stroke();

          // Draw rotating sweep beam with phosphorescent gradient
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(angle);

          const sweepGradient = ctx.createLinearGradient(0, 0, radius, 0);
          sweepGradient.addColorStop(0, 'rgba(0, 242, 254, 0.8)');
          sweepGradient.addColorStop(1, 'rgba(0, 242, 254, 0.05)');

          ctx.fillStyle = sweepGradient;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, radius, 0, -Math.PI / 4, true);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = '#00f2fe';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(radius, 0);
          ctx.stroke();
          ctx.restore();

          // Draw ultrasonic blips at Front (top), Right (right), Back (bottom), Left (left)
          // Range scale: max 400cm maps to radius
          const plotBlip = (dist, dirAngle) => {
            if (!dist || dist > 380) return;
            const r = Math.min(radius, (dist / 400) * radius);
            const bx = cx + r * Math.cos(dirAngle);
            const by = cy + r * Math.sin(dirAngle);

            ctx.fillStyle = dist < 40 ? '#ef4444' : '#f59e0b';
            ctx.beginPath();
            ctx.arc(bx, by, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = dist < 40 ? 'rgba(239, 68, 68, 0.5)' : 'rgba(245, 158, 11, 0.5)';
            ctx.beginPath();
            ctx.arc(bx, by, 7, 0, Math.PI * 2);
            ctx.stroke();
          };

          plotBlip(distances.front, -Math.PI / 2); // Front (Up)
          plotBlip(distances.right, 0);            // Right
          plotBlip(distances.back, Math.PI / 2);   // Back (Down)
          plotBlip(distances.left, Math.PI);       // Left

          angle += 0.04;
          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          cancelAnimationFrame(animationFrameId);
        };
      }, [distances]);

      return (
        <div className="relative flex flex-col items-center">
          <canvas
            ref={canvasRef}
            width={160}
            height={160}
            className="rounded-full border border-cyan-500/40 shadow-[0_0_15px_rgba(0,242,254,0.15)]"
          />
          <div className="text-[10px] font-mono text-cyan-400 mt-2 font-bold tracking-wider">
            360° ULTRASONIC RADAR
          </div>
        </div>
      );
    }

        return {

          right: raycast(0, 1),
          back: raycast(1, 0),

        setVisitedNodes([]);

      }, [robot, addLog]);

      // Toggle cell state with active tool
      const handleCellClick = (y, x) => {
        if (isRunning) return;
        sound.playClick();

        setGrid(prev => {
          const next = prev.map(row => [...row]);

      // Manual Navigation (WASD / D-Pad)
      const handleManualMove = useCallback((dy, dx, targetAngle) => {

          if (gridRef.current[ny][nx] === CELL_OBSTACLE) {

          if (gridRef.current[ny][nx] === CELL_DUST) {
            sound.playClean();
            setVacuumMotorOn(true);
            setDustCollectedCount(c => c + 1);
            setDustSensorVoltage(3.62);

            setTimeout(() => {
              setVacuumMotorOn(false);
              setDustSensorVoltage(0.48);
              setDustDensity(20);
            }, 500);
            setGrid(g => {
              const n = g.map(row => [...row]);
              n[ny][nx] = CELL_CLEANED;
              return n;
            });
          } else {
            setGrid(g => {
              const n = g.map(row => [...row]);
              if (n[ny][nx] === CELL_EMPTY) n[ny][nx] = CELL_CLEANED;
              return n;
            });
          }

          setMovementsCount(m => m + 1);

      }, [addLog]);

      // ==========================================
      // AUTONOMOUS PLANNING ENGINE
      // ==========================================
      const planNextTarget = useCallback(() => {
        const remainingDusts = getRemainingDusts(gridRef.current);
        if (remainingDusts.length === 0) {
          setIsRunning(false);
          setRobotStatus('FINISHED');
          setWheelMotorRPM({ left: 0, right: 0 });
          setVacuumMotorOn(false);
          setActivePipelineStage(4);
          sound.playComplete();
          setShowVictoryModal(true);
          addLog('VERIFY', 'Mission Complete! All dust particles collected. Returning to dock state.', 'success');
          return null;
        }

        // 1. PERCEIVE: Find closest reachable dust particle (Greedy Nearest Neighbor target)
        setActivePipelineStage(0);
        setRobotStatus('PERCEIVING');
        const currRobot = robotRef.current;
        const activeAlgo = algoRef.current;

        // Sort dusts by Manhattan distance
        const sortedDusts = [...remainingDusts].sort((a, b) => {
          const distA = Math.abs(currRobot.y - a.y) + Math.abs(currRobot.x - a.x);
          const distB = Math.abs(currRobot.y - b.y) + Math.abs(currRobot.x - b.x);
          return distA - distB;
        });

        // Find first reachable dust target
        let chosenDust = null;
        let chosenResult = null;

        for (const candidate of sortedDusts) {
          const res = Pathfinder.run(activeAlgo, { y: currRobot.y, x: currRobot.x }, candidate, gridRef.current);
          if (res.path && res.path.length > 0) {
            chosenDust = candidate;
            chosenResult = res;
            break;
          }
        }

        if (!chosenDust || !chosenResult) {
          addLog('PLAN', `No reachable path found to any remaining dust targets using ${ALGORITHMS[activeAlgo].name}. Targets blocked by obstacles.`, 'warn');
          setIsRunning(false);
          setRobotStatus('IDLE');
          return null;
        }

        const manhattan = Math.abs(currRobot.y - chosenDust.y) + Math.abs(currRobot.x - chosenDust.x);
        addLog('PERCEIVE', `Perceive: Dust detected at [${chosenDust.x}, ${chosenDust.y}] (Distance: ${manhattan} cells). Optical sensor: 3.2V.`, 'info');

        setTargetDust(chosenDust);
        addLog('THINK', `Think: Target identified at [${chosenDust.x}, ${chosenDust.y}]. Evaluating collision-free trajectory.`, 'info');

        // 3. PLAN: Path finding
        setActivePipelineStage(2);
        setRobotStatus('PLANNING');
        setVisitedNodes(chosenResult.visitedNodes);
        setAlgoMetrics({
          nodesExplored: chosenResult.nodesExplored,
          pathLength: chosenResult.path.length > 0 ? chosenResult.path.length - 1 : 0,
          timeMs: chosenResult.timeMs
        });

        addLog('PLAN', `Plan: ${ALGORITHMS[activeAlgo].name} computed optimal path. Steps: ${chosenResult.path.length - 1}, Nodes Explored: ${chosenResult.nodesExplored}, Time: ${chosenResult.timeMs}ms.`, 'info');
        setPlannedPath(chosenResult.path);
        setCurrentPathIndex(1); // 0 is start node
        return chosenResult.path;
      }, [getRemainingDusts, addLog]);

      // Main Autonomous Simulation Loop
      useEffect(() => {
        if (!isRunning) return;

        const baseInterval = 380;
        const intervalTime = Math.max(50, Math.floor(baseInterval / simSpeed));

        const timer = setInterval(() => {
          if (plannedPathRef.current.length > 0 && currentPathIndexRef.current < plannedPathRef.current.length) {
            const nextNode = plannedPathRef.current[currentPathIndexRef.current];
            const currRobot = robotRef.current;

            // 4. ACT: Move robot along path

            setRobotStatus('MOVING');

            let newAngle = currRobot.angle;
            const dy = nextNode.y - currRobot.y;
            const dx = nextNode.x - currRobot.x;
            if (dy === -1) newAngle = 0;   // North
            else if (dx === 1) newAngle = 90;  // East
            else if (dy === 1) newAngle = 180; // South
            else if (dx === -1) newAngle = 270;// West

            sound.playStep();
            setWheelMotorRPM({ left: 140, right: 140 });

            setRobot({ x: nextNode.x, y: nextNode.y, angle: newAngle });
            setMovementsCount(m => m + 1);
            setBattery(b => Math.max(2, Number((b - 0.08).toFixed(2))));

            setGrid(prev => {
              const nextGrid = prev.map(row => [...row]);
              if (nextGrid[nextNode.y][nextNode.x] === CELL_EMPTY) {
                nextGrid[nextNode.y][nextNode.x] = CELL_CLEANED;
              }
              return nextGrid;
            });

            currentPathIndexRef.current += 1;
            setCurrentPathIndex(currentPathIndexRef.current);

            // Check if robot arrived at dust target
            if (currentPathIndexRef.current >= plannedPathRef.current.length) {
              setActivePipelineStage(4); // 5. VERIFY
              setRobotStatus('CLEANING');
              sound.playClean();
              setVacuumMotorOn(true);
              setWheelMotorRPM({ left: 0, right: 0 });
              setDustSensorVoltage(3.85);
              setDustDensity(420);

              addLog('ACT', `Act: Robot arrived at [${nextNode.x}, ${nextNode.y}]. Vacuum motor engaged at 18,500 RPM.`, 'info');

              setTimeout(() => {
                setGrid(prev => {
                  const nextGrid = prev.map(row => [...row]);
                  nextGrid[nextNode.y][nextNode.x] = CELL_CLEANED;
                  return nextGrid;
                });
                setDustCollectedCount(c => c + 1);
                setVacuumMotorOn(false);
                setDustSensorVoltage(0.48);
                setDustDensity(18);
                addLog('VERIFY', `Verify: Cleaning completed at [${nextNode.x}, ${nextNode.y}]. Sensor confirms dust cleared. Cell updated to green.`, 'success');

                plannedPathRef.current = [];
                setPlannedPath([]);
                currentPathIndexRef.current = 0;
                setCurrentPathIndex(0);
                planNextTarget();
              }, Math.min(280, intervalTime));
            }
          } else {
            planNextTarget();
          }
        }, intervalTime);

        return () => clearInterval(timer);
      }, [isRunning, simSpeed, planNextTarget, addLog]);

      // Start / Pause Controls
      const toggleCleaning = () => {
        sound.playClick();
        if (isRunning) {
          setIsRunning(false);
          setRobotStatus('PAUSED');
          setWheelMotorRPM({ left: 0, right: 0 });
          setVacuumMotorOn(false);
          addLog('THINK', 'Autonomous execution paused by user override.', 'warn');
        } else {
          setIsRunning(true);
          setRobotStatus('PERCEIVING');
          addLog('THINK', `Autonomous cleaning engaged. Active Algorithm: ${ALGORITHMS[algorithm].name}.`, 'info');

        sound.playClick();

        sound.playClick();

          return;

        const results = {};

          const res = Pathfinder.run(algoKey, start, target, grid);
          results[algoKey] = {
            name: ALGORITHMS[algoKey].name,
            badge: ALGORITHMS[algoKey].badge,
            type: ALGORITHMS[algoKey].type,
            optimality: ALGORITHMS[algoKey].optimality,
            complexity: ALGORITHMS[algoKey].complexity,
            nodesExplored: res.nodesExplored,
            pathLength: res.path.length > 0 ? res.path.length - 1 : 0,
            timeMs: res.timeMs,
            success: res.path.length > 0
          };
        });

        setBenchmarkResults(results);
        addLog('THINK', `Executed 4-way algorithm benchmark on target [${target.x}, ${target.y}].`, 'info');
      };

        return { percent, cleanedCount, totalNavigable };

                    <span className="text-slate-400">Algorithm Used:</span>
                    <div className="text-cyan-400 font-bold text-sm">{ALGORITHMS[algorithm].name.split(' ')[0]}</div>
                  </div>
                  <div>
                    <span className="text-slate-400">Total Movements:</span>
                    <div className="text-slate-200 font-bold text-sm">{movementsCount} steps</div>
                  </div>
                  <div>
                    <span className="text-slate-400">Path Efficiency:</span>
                    <div className="text-purple-400 font-bold text-sm">{pathEfficiency}%</div>
                  </div>
                </div>

                {/* Actions */}
                <div className="flex gap-3 justify-center">
                  <button
                    onClick={() => setShowVictoryModal(false)}
                    className="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold transition-colors"
                  >
                    CLOSE WINDOW
                  </button>
                  <button
                    onClick={() => {
                      setShowVictoryModal(false);
                      handleRandomizeDust();
                      toggleCleaning();
                    }}
                    className="px-5 py-2 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-slate-950 text-xs font-black transition-colors shadow-lg"
                  >
                    CLEAN AGAIN ▶
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ============================================================== */}
          {/* BOTTOM PERSISTENT FOOTER */}
          {/* ============================================================== */}
          <footer className="hud-card px-5 py-2.5 border-t border-slate-800 text-[11px] font-mono text-slate-500 flex flex-wrap items-center justify-between gap-4">
            <div className="flex items-center gap-3">
              <span className="flex items-center gap-1.5">
                <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                <span>SYSTEM ONLINE</span>
              </span>
              <span>&bull;</span>
              <span>DUSTBOT – INTELLIGENT AUTONOMOUS CLEANING AGENT</span>
              <span>&bull;</span>
              <span>COLLEGE AIML PROJECT PRESENTATION</span>
            </div>
            <div>
              <span>Hardware values are simulated for the academic prototype demonstration</span>
            </div>
          </footer>
        </div>
      );
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
